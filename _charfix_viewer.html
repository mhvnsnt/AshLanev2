<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#1a1a22}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const params = new URLSearchParams(location.search);
const model = params.get('model');
const pose = params.get('pose') || 'tpose';
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(800, 800);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a22);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
const camSide = params.get('side') || 'profile';
if (camSide === 'front') camera.position.set(3.2, 1.4, 0.6);
else camera.position.set(0.6, 1.4, 3.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(2,4,3); scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.5); fill.position.set(-2,2,-2); scene.add(fill);
// ground grid for reference
const grid = new THREE.GridHelper(4, 8, 0x555555, 0x333333); scene.add(grid);
const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
loader.load(model, (gltf) => {
  const root = gltf.scene;
  scene.add(root);
  // center model
  const box = new THREE.Box3().setFromObject(root);
  const c = box.getCenter(new THREE.Vector3());
  root.position.sub(c); root.position.y += 1.0;
  const bones = {};
  root.traverse(o => { if (o.isBone) bones[o.name] = o; });
  console.log('BONECOUNT:'+Object.keys(bones).length+' POSE:'+pose);
  const bn = (n) => bones[n] || bones['mixamorig:'+n] || bones['mixamorig'+n];
  if (pose === 'armsup') {
    // raise both arms to test shoulder weights (moderate)
    for (const side of ['Left','Right']) {
      const sh = bn(side+'Shoulder')||bn(side+'Arm');
      const arm = bn(side+'Arm')||bn(side+'ForeArm');
      if (sh) sh.rotation.z = (side==='Left'?-1:1)*0.4;
      if (arm) arm.rotation.z = (side==='Left'?-1:1)*0.15;
    }
  } else if (pose === 'punch') {
    const arm = bn('RightArm'), fore = bn('RightForeArm');
    if (arm) { arm.rotation.z = -1.0; arm.rotation.y = -0.2; }
    if (fore) fore.rotation.z = -0.1;
  }
  controls.update();
  renderer.render(scene, camera);
  document.title = 'READY';
}, undefined, (e) => { document.title = 'ERROR:'+e.message+' STACK:'+(e.stack||'').split('\n').slice(0,3).join(' | '); });
</script></body></html>
