<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AshLane Splat Viewer (MIT pipeline)</title>
<style>
  body { margin: 0; background: #0b0d14; overflow: hidden; }
  canvas { display: block; }
  #hud { position: fixed; top: 12px; left: 12px; color: #9df; font: 13px monospace;
         background: rgba(0,0,0,.55); padding: 8px 10px; border-radius: 6px; }
</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js",
               "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="hud">splat: <span id="name">—</span> · <span id="count">—</span> points</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/**
 * Minimal 3D Gaussian Splat viewer for the AshLane pipeline.
 * Parses binary PLY (3DGS format: x,y,z, f_dc_0..2, opacity, scale_0..2, rot_0..3)
 * and renders camera-facing quads with radial alpha falloff — the standard
 * splat look. For production LOD/compression see reall3d-com/Reall3dViewer (MIT).
 */

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(1280, 800);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d14);
const camera = new THREE.PerspectiveCamera(50, 1280 / 800, 0.01, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

function parseSplatPLY(buf) {
  const text = new TextDecoder().decode(buf.slice(0, 2048));
  const endH = text.indexOf('end_header');
  const header = text.slice(0, endH);
  const dataStart = endH + 'end_header'.length + 1;
  const m = header.match(/element vertex (\d+)/);
  const n = parseInt(m[1], 10);
  const props = [...header.matchAll(/property float (\w+)/g)].map(x => x[1]);
  const stride = props.length * 4;
  const dv = new DataView(buf.buffer, buf.byteOffset + dataStart);
  const idx = Object.fromEntries(props.map((p, i) => [p, i * 4]));
  const SH_C0 = 0.28209479177387814;
  const pos = new Float32Array(n * 3);
  const col = new Float32Array(n * 3);
  const scl = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const b = i * stride;
    pos[i*3] = dv.getFloat32(b + idx.x, true);
    pos[i*3+1] = dv.getFloat32(b + idx.y, true);
    pos[i*3+2] = dv.getFloat32(b + idx.z, true);
    col[i*3] = Math.min(1, Math.max(0, 0.5 + SH_C0 * dv.getFloat32(b + idx.f_dc_0, true)));
    col[i*3+1] = Math.min(1, Math.max(0, 0.5 + SH_C0 * dv.getFloat32(b + idx.f_dc_1, true)));
    col[i*3+2] = Math.min(1, Math.max(0, 0.5 + SH_C0 * dv.getFloat32(b + idx.f_dc_2, true)));
    // world-space splat size from log-scales (use max axis)
    const s0 = Math.exp(dv.getFloat32(b + idx.scale_0, true));
    const s1 = Math.exp(dv.getFloat32(b + idx.scale_1, true));
    const s2 = Math.exp(dv.getFloat32(b + idx.scale_2, true));
    scl[i] = Math.max(s0, s1, s2);
  }
  return { n, pos, col, scl };
}

window.renderSplat = async (url) => {
  window.__ready = false; window.__error = null;
  try {
    document.getElementById('name').textContent = url.split('/').pop();
    const res = await fetch(url);
    const buf = new Uint8Array(await res.arrayBuffer());
    const { n, pos, col, scl } = parseSplatPLY(buf);
    document.getElementById('count').textContent = n.toLocaleString();

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
    geo.setAttribute('aScale', new THREE.BufferAttribute(scl, 1));

    // Bounding sphere for camera framing
    geo.computeBoundingSphere();
    const c = geo.boundingSphere.center, r = geo.boundingSphere.radius;

    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: { uPixelRatio: { value: renderer.getPixelRatio() }, uHeight: { value: 800 } },
      vertexShader: `
        attribute vec3 aColor; attribute float aScale;
        varying vec3 vColor;
        uniform float uPixelRatio; uniform float uHeight;
        void main() {
          vColor = aColor;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          // project world size to pixels
          float px = aScale * uHeight / (-mv.z * 2.0 * tan(0.4363));
          gl_PointSize = max(1.0, px * 3.0 * uPixelRatio);
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        varying vec3 vColor;
        void main() {
          vec2 d = gl_PointCoord - 0.5;
          float a = smoothstep(0.5, 0.12, length(d));
          if (a < 0.02) discard;
          gl_FragColor = vec4(vColor, a * 0.85);
        }`,
    });
    const points = new THREE.Points(geo, mat);
    scene.add(points);

    camera.position.set(c.x - r * 1.6, c.y + r * 1.1, c.z + r * 2.2);
    controls.target.copy(c);
    controls.update();
    for (let k = 0; k < 6; k++) { controls.update(); renderer.render(scene, camera); }
    window.__ready = true;
  } catch (e) { window.__error = String(e && e.stack || e); window.__ready = true; }
};
</script>
</body>
</html>
