// Crowd animation state
let crowdExcite = 0; // 0=calm, 1=wild

function animateCrowd(t) {
  for (let i = 0; i < CROWD_N; i++) {
    const d = crowdData[i];
    const bounce = Math.sin(t * (3 + crowdExcite * 4) + d.phase) * (0.03 + crowdExcite * 0.12);
    const sway = Math.sin(t * 1.5 + d.phase) * 0.05 * crowdExcite;
    dummy.position.set(d.x + sway, d.y + bounce, d.z);
    dummy.rotation.y = Math.atan2(-d.x, -d.z) + sway * 2;
    dummy.scale.set(d.s, d.s, d.s);
    dummy.updateMatrix();
    bodies.setMatrixAt(i, dummy.matrix);
    dummy.position.y = d.y + 0.75 * d.s + bounce;
    dummy.updateMatrix();
    heads.setMatrixAt(i, dummy.matrix);
  }
  bodies.instanceMatrix.needsUpdate = true;
  heads.instanceMatrix.needsUpdate = true;
}

// Volumetric beam shader
const beamVert = `
varying vec2 vUv;
varying vec3 vPos;
void main() {
  vUv = uv;
  vPos = position;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;
const beamFrag = `
uniform vec3 uColor;
uniform float uIntensity;
uniform float uTime;
varying vec2 vUv;
varying vec3 vPos;
void main() {
  // Soft edges: fade at cone silhouette
  float edge = smoothstep(0.0, 0.35, vUv.x) * smoothstep(1.0, 0.65, vUv.x);
  // Fade along length (bright at top, fading down)
  float len = smoothstep(0.0, 0.25, vUv.y) * smoothstep(1.0, 0.3, vUv.y);
  // Subtle animated density
  float dens = 0.85 + 0.15 * sin(uTime * 2.0 + vUv.y * 10.0);
  float a = edge * len * uIntensity * dens;
  gl_FragColor = vec4(uColor, a);
}`;

const beams = [];
const beamUniformsList = [];
function makeBeam(color) {
  const geo = new THREE.ConeGeometry(2.2, 16, 24, 1, true);
  const uni = {
    uColor: { value: new THREE.Color(color) },
    uIntensity: { value: 0 },
    uTime: { value: 0 },
  };
  const mat = new THREE.ShaderMaterial({
    vertexShader: beamVert,
    fragmentShader: beamFrag,
    uniforms: uni,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide,
  });
  const mesh = new THREE.Mesh(geo, mat);
  beamUniformsList.push(uni);
  beams.push(mesh);
  scene.add(mesh);
  return mesh;
}

// Bone helpers
function collectBones(root) {
  const bones = {};
  root.traverse(o => {
    if (o.isBone) {
      let n = o.name;
      if (n.startsWith('mixamorig:')) n = n.slice(10);
      else if (n.startsWith('mixamorig')) n = n.slice(9);
      bones[n] = o;
    }
  });
  return bones;
}

// Procedural walk - carefully tuned for Mixamo bone axes
// Verified against retargeted mocap for correct axis conventions
// Bone local rotation = rest * swing (swing applied in bone local space)
function proceduralWalk(bones, rest, t) {
  const freq = 1.9; // steps per second
  const ph = t * freq * Math.PI * 2;
  
  const eulerQ = (ex, ey, ez) => new THREE.Quaternion().setFromEuler(new THREE.Euler(ex, ey, ez));
  const R = (bone, ex, ey, ez) => rest[bone].clone().multiply(eulerQ(ex, ey, ez));
  const pose = new Map();
  
  // Legs: alternate swing
  const legSwing = 0.38; // ~22 degrees
  const kneeBend = 0.5;  // max knee bend
  
  // Left leg forward when sin(ph) > 0
  const lSwing = Math.sin(ph) * legSwing;
  pose.set('LeftUpLeg', R('LeftUpLeg', -lSwing, 0, 0.03));
  const lKnee = Math.max(0, Math.sin(ph + 0.6)) * kneeBend + 0.08;
  pose.set('LeftLeg', R('LeftLeg', lKnee, 0, 0));
  pose.set('LeftFoot', R('LeftFoot', lSwing * 0.5 - 0.1, 0, 0));
  
  // Right leg (opposite phase)
  const rSwing = Math.sin(ph + Math.PI) * legSwing;
  pose.set('RightUpLeg', R('RightUpLeg', -rSwing, 0, -0.03));
  const rKnee = Math.max(0, Math.sin(ph + Math.PI + 0.6)) * kneeBend + 0.08;
  pose.set('RightLeg', R('RightLeg', rKnee, 0, 0));
  pose.set('RightFoot', R('RightFoot', rSwing * 0.5 - 0.1, 0, 0));
  
  // Hips: slight sway
  pose.set('Hips', R('Hips', 0.02, Math.sin(ph)*0.04, Math.sin(ph)*0.03));
  
  // Spine: slight forward lean
  pose.set('Spine', R('Spine', 0.08, 0, Math.sin(ph)*0.02));
  pose.set('Spine2', R('Spine2', 0.05, Math.sin(ph+Math.PI)*0.03, 0));
  
  // Arms: opposite swing to legs, elbows bent
  const armSwing = 0.28;
  pose.set('LeftArm', R('LeftArm', -Math.sin(ph + Math.PI) * armSwing, 0, 0.12));
  pose.set('LeftForeArm', R('LeftForeArm', -0.35, 0, 0));
  pose.set('RightArm', R('RightArm', -Math.sin(ph) * armSwing, 0, -0.12));
  pose.set('RightForeArm', R('RightForeArm', -0.35, 0, 0));
  
  // Head: stable
  pose.set('Head', R('Head', -0.05, 0, 0));
  if (rest['Neck']) pose.set('Neck', R('Neck', -0.03, 0, 0));
  
  return pose;
}

function sampleClip(clip, boneMap, t) {
  // Returns Map<bonesName, Quaternion>
  const out = new Map();
  const times = clip.times;
  const dur = clip.dur;
  const lt = ((t % dur) + dur) % dur;
  let i = 0;
  while (i < times.length - 2 && times[i+1] < lt) i++;
  const t0 = times[i], t1 = times[i+1];
  const f = Math.max(0, Math.min(1, (lt - t0) / Math.max(1e-6, t1 - t0)));
  for (const srcBone in clip.atk) {
    const dstBone = boneMap ? boneMap[srcBone] : srcBone;
    if (!dstBone) continue;
    const keys = clip.atk[srcBone];
    const a = keys[i], b = keys[Math.min(i+1, keys.length-1)];
    const qa = new THREE.Quaternion(a[0],a[1],a[2],a[3]);
    const qb = new THREE.Quaternion(b[0],b[1],b[2],b[3]);
    out.set(dstBone, qa.slerp(qb, f));
  }
  return out;
}

function applyPose(bones, rest, poseMap, blend = 1) {
  for (const k in bones) bones[k].quaternion.copy(rest[k]);
  if (blend <= 0) return;
  const tmp = new THREE.Quaternion();
  for (const [bone, q] of poseMap) {
    if (bones[bone] && rest[bone]) {
      if (blend >= 1) bones[bone].quaternion.copy(q);
      else {
        tmp.copy(rest[bone]).slerp(q, blend);
        bones[bone].quaternion.copy(tmp);
      }
    }
  }
}

// ================= TIMELINE =================
const sstep = (a,b,x) => { const t = Math.min(1, Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
const lerp = (a,b,t) => a + (b-a)*t;

// Toro state
let toroZ = RING + 14; // start at back of ramp
const TORO_RING_Z = 2.0; // where he stops near ring

function toroPose(t) {
  // Reset
  for (const k in toroBones) toroBones[k].quaternion.copy(toroRest[k]);
  toro.position.y = TORO_BASE_Y;

  // --- 5-14s: Walk down ramp (procedural, verified Mixamo axes) ---
  if (t >= 5 && t < 14) {
    const wt = t - 5;
    const pose = proceduralWalk(toroBones, toroRest, wt);
    applyPose(toroBones, toroRest, pose, 1);
    // Move forward
    const prog = (t - 5) / 9;
    toroZ = lerp(RING + 14, TORO_RING_Z + 3.5, prog);
    // Bob slightly with steps
    toro.position.y = TORO_BASE_Y + Math.abs(Math.sin(wt * 1.9 * Math.PI * 2)) * 0.03;
  }
  // --- 14-22s: At ringside, power stance (use taunt base, held) ---
  else if (t >= 14 && t < 22) {
    // Strong idle: subtle weight shift, arms ready
    const bt = (t - 14) * 0.8;
    const pose = proceduralWalk(toroBones, toroRest, bt * 0.15); // very slow, almost still
    applyPose(toroBones, toroRest, pose, sstep(14, 15, t) * 0.6);
    toroZ = TORO_RING_Z + 4.2 - sstep(16, 18, t) * 0.8;
  }
  // --- 22-30s: Taunt (real Kofi taunt mocap) ---
  else if (t >= 22 && t < 30) {
    const tt = (t - 22);
    const pose = sampleClip(tauntClip, null, tt); // already Mixamo names
    // tauntClip uses canonical Mixamo names directly
    const mapped = new Map();
    for (const [k, v] of pose) mapped.set(k, v);
    applyPose(toroBones, toroRest, mapped, sstep(22, 22.8, t) * (1 - sstep(29, 30, t)));
  }
  // --- 30-50s: Face-off (Toro enters ring, confronts opponent) ---
  else if (t >= 30) {
    const bt = (t - 30) * 0.5;
    const pose = proceduralWalk(toroBones, toroRest, bt);
    applyPose(toroBones, toroRest, pose, sstep(30, 31, t) * 0.7);
    // Step into ring during 30-38, then hold face-off
    toroZ = lerp(TORO_RING_Z + 2.0, 0.5, sstep(30, 36, t));
    toro.position.y = TORO_BASE_Y + sstep(33, 36, t) * 0.96; // step up onto canvas
  }

  toro.position.z = toroZ;
  // Face forward (toward ring/camera)
  toro.rotation.y = 0;
}

function cainPose(t) {
  for (const k in cainBones) cainBones[k].quaternion.copy(cainRest[k]);
  cain.position.y = CAIN_BASE_Y;

  // Opponent waits in ring - menacing idle
  const idleT = t * 0.3;
  const pose = proceduralWalk(cainBones, cainRest, idleT);
  const blendAmt = t < 22 ? 0.4 : (t < 38 ? 0.55 : 0.65);
  applyPose(cainBones, cainRest, pose, blendAmt);

  if (t >= 38) {
    cain.rotation.y = Math.PI + 0.3; // face Toro
  }
}

function shot(t) {
  const P = (x,y,z) => new THREE.Vector3(x,y,z);
  // Toro z position for framing
  const tz = toro.position.z;

  if (t < 5) {
    // Dark arena wide
    const k = sstep(0, 5, t);
    return { pos: P(lerp(-9, -7, k), lerp(7, 6, k), lerp(13, 11, k)), look: P(0, 2, 2) };
  } else if (t < 14) {
    // Track Toro walking down ramp — camera beside ramp, not behind
    const k = sstep(5, 14, t);
    return {
      pos: P(lerp(5.0, 4.0, k), lerp(2.4, 2.0, k), tz + lerp(4.5, 4.0, k)),
      look: P(0, 1.4, tz - 1.5)
    };
  } else if (t < 22) {
    // Orbit around Toro at ringside
    const a = lerp(0.5, 2.0, sstep(14, 22, t));
    const r = 6.0;
    return {
      pos: P(Math.sin(a)*r, 2.2, tz + Math.cos(a)*r),
      look: P(0, 1.3, tz - 0.5)
    };
  } else if (t < 30) {
    // Taunt close-up, then cut to Cain
    if (t < 26) {
      const k = sstep(22, 26, t);
      return {
        pos: P(lerp(2.2, 1.8, k), lerp(1.9, 1.75, k), tz + lerp(3.2, 2.6, k)),
        look: P(0, 1.45, tz)
      };
    } else {
      // Cut to opponent in ring - from the side, clear of posts
      return {
        pos: P(0, 2.8, -6.5),
        look: P(1.2, 1.5, -1.0)
      };
    }
  } else {
    // 30-50s: Face-off — Toro enters ring, confrontation
    const k = sstep(30, 46, t);
    return {
      pos: P(lerp(2.5, 3.5, k), lerp(2.8, 2.0, k), lerp(8.5, 5.5, k)),
      look: P(0.3, 1.3, lerp(2.0, 0, k))
    };
  }
}

// ================= LIGHTING TIMELINE =================
const GOLD = new THREE.Color(0xffb347), RED = new THREE.Color(0xff2211),
      BLUE = new THREE.Color(0x4488ff), WHITE = new THREE.Color(0xfff5e8);

function lights(t) {
  // Base: very dark
  amb.intensity = lerp(0.015, 0.06, sstep(0, 6, t));

  // Beams
  beamUniformsList.forEach((u, i) => {
    u.uTime.value = t;
    // Beams activate at entrance
    let inten = 0;
    if (t >= 4) {
      inten = sstep(4, 7, t) * 0.35;
      // Pulse during signature
      if (t >= 30 && t < 38) inten *= 1.6;
      // Full during face-off
      if (t >= 38) inten = 0.5;
      // Color shift
      if (i % 2 === 0) u.uColor.value.copy(GOLD).lerp(RED, sstep(22, 30, t) * 0.7);
      else u.uColor.value.copy(WHITE).lerp(BLUE, sstep(14, 22, t) * 0.5);
    }
    // Flicker slightly
    u.uIntensity.value = inten * (0.92 + 0.08 * Math.sin(t * 7 + i * 2.1));
  });

  // Moving spots follow Toro
  const tz = toro.position.z;
  spots.forEach((s, i) => {
    const active = sstep(4, 6, t);
    s.intensity = active * (180 + 60 * Math.sin(t * 0.8 + i));
    // Sweep targets
    const sa = t * 0.4 + i * (Math.PI/2);
    if (t < 14) {
      // Follow Toro on ramp
      s.target.position.set(Math.sin(sa)*1.5, 1.2, tz + Math.cos(sa)*1.5);
    } else if (t < 38) {
      // Orbit around Toro
      s.target.position.set(Math.sin(sa)*2, 1.0 + Math.sin(t+i)*0.5, tz + Math.cos(sa)*2 - 1);
    } else {
      // Face-off: light both
      s.target.position.set(Math.sin(sa)*1.5, 1.2, Math.cos(sa)*1.5);
    }
    // Color chase
    const cols = [GOLD, RED, BLUE, WHITE];
    s.color.copy(cols[i]).lerp(cols[(i+1)%4], 0.5 + 0.5*Math.sin(t*0.5 + i));
  });

  // Crowd wash comes up with excitement
  crowdWash.intensity = 0.15 * sstep(5, 10, t) + 0.25 * crowdExcite;

  // Haze
  haze.material.opacity = 0.35 * sstep(3, 8, t);

  // Crowd excitement follows narrative
  if (t < 5) crowdExcite = 0.1;
  else if (t < 14) crowdExcite = lerp(0.1, 0.5, sstep(5, 14, t));
  else if (t < 22) crowdExcite = 0.6;
  else if (t < 30) crowdExcite = 0.8;
  else if (t < 38) crowdExcite = 1.0;
  else crowdExcite = 0.9;
}

// ================= MAIN RENDER =================
window.__renderAt = function(t) {
  toroPose(t);
  cainPose(t);
  animateCrowd(t);
  lights(t);

  // Haze drift
  const pa = hazeGeo.attributes.position.array;
  for (let i = 0; i < HAZE_N; i++) {
    pa[i*3+1] += 0.004;
    pa[i*3] += Math.sin(t*0.3 + i) * 0.003;
    if (pa[i*3+1] > 10) pa[i*3+1] = 0;
  }
  hazeGeo.attributes.position.needsUpdate = true;

  const s = shot(t);
  camera.position.copy(s.pos);
  camera.lookAt(s.look);

  renderer.render(scene, camera);
  return true;
};

window.__ready = true;
window.__dur = DUR;
console.log('Arena cinematic ready');
</script>
