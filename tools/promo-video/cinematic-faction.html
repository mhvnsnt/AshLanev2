async function loadChar(file, tint) {
  const gltf = await loader.loadAsync('/models/' + file);
  const root = gltf.scene;
  scene.add(root);
  // Repair broken skin weights (Onyx/Hollow/Echo have bad weight transfers)
  if (NEEDS_RESKIN.has(file)) {
    root.traverse(o => {
      if (o.isSkinnedMesh) repairSkinWeights(o, 12);
    });
  }
  // Shared staging: ONE code path for ground alignment + facing (staging.js).
  // Feet would sit ~0.9m under the street without the ground offset — the
  // previous version overwrote root.position.y every frame and sank the cast.
  const staging = new CharacterStaging(root); // forward auto-detected from the skeleton
  staging.centerXZ().syncY(); // feet on y=0, footprint centered
  const bones = {};
  root.traverse(o => { if (o.isBone) bones[o.name.replace(/^mixamorig:?/, '')] = o; });
  const rest = {};
  for (const k in bones) rest[k] = bones[k].quaternion.clone();
  if (tint) {
    root.traverse(o => {
      if (o.isMesh) {
        o.material = o.material.clone();
        o.material.color.setHex(0x551111);
        o.material.emissive = new THREE.Color(0x220505);
      }
    });
  }
  root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = false; } });
  return { root, bones, rest, staging };
}

const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;

function shot(t) {
  let p0, p1, l0, l1, a, b;
  if (t < 5) {           // 1: empty street
    a = 0; b = 5;
    p0 = V3(0, 2.2, 14); p1 = V3(0, 2.0, 12); l0 = l1 = V3(0, 1.5, 0);
  } else if (t < 12) {   // 2: the leader — she walks out of the dark toward camera
    a = 5; b = 12;
    p0 = V3(2.1, 1.05, -0.5); p1 = V3(1.7, 1.2, -1.2);
    l0 = V3(0, 1.5, 7.5); l1 = V3(0, 1.4, 3.2);
  } else if (t < 20) {   // 3: the gang assembles
    a = 12; b = 20;
    p0 = V3(-4.5, 1.6, 5.5); p1 = V3(-5.5, 1.8, 7.5); l0 = l1 = V3(0, 1.4, 2.5);
  } else if (t < 26) {   // 4: personality cuts
    const cuts = [
      { a: 20, b: 21.5, p: V3(0.3, 1.7, 5.0), l: V3(-1.2, 1.4, 2.8) },   // Static
      { a: 21.5, b: 23, p: V3(-0.3, 1.7, 5.0), l: V3(1.2, 1.4, 2.8) },   // Hollow
      { a: 23, b: 24.5, p: V3(3.7, 1.7, 5.6), l: V3(2.2, 1.4, 3.6) },    // Echo
      { a: 24.5, b: 26, p: V3(-3.7, 1.7, 5.6), l: V3(-2.2, 1.4, 3.6) },  // Cipher
    ];
    for (const c of cuts) if (t >= c.a && t < c.b) return { pos: c.p, look: c.l };
    return { pos: cuts[0].p, look: cuts[0].l };
  } else if (t < 32) {   // 5: the rival crew
    a = 26; b = 32;
    p0 = V3(0, 2.1, -1.5); p1 = V3(0, 1.9, -2.5); l0 = l1 = V3(0, 1.4, -14);
  } else if (t < 46) {   // 6: the takeover
    a = 32; b = 46;
    p0 = V3(3.0, 2.4, 9.0); p1 = V3(2.0, 1.8, 5.5); l0 = l1 = V3(0, 1.3, -2);
  } else {               // 7: title hold
    a = 46; b = 50;
    p0 = V3(1.5, 1.7, 6.0); p1 = V3(1.4, 1.65, 5.7); l0 = l1 = V3(0, 1.35, 1.0);
  }
  const k = sstep(a, b, t), e = k * k * (3 - 2 * k);
  return { pos: p0.clone().lerp(p1, e), look: l0.clone().lerp(l1, e) };
}

// ================= LIGHTING TIMELINE =================
const GOLD = new THREE.Color(0xffb347), RED = new THREE.Color(0xff2a20),
      SODIUM = new THREE.Color(0xffb45e), NEON_G = new THREE.Color(0x39ff6a);
const tmpC = new THREE.Color();

function lights(t) {
  amb.intensity = lerp(0.03, 0.10, sstep(0, 10, t));
  // neon ramps with the gang
  neonGreen.intensity = 30 * sstep(4, 10, t);
  neonPink.intensity = 30 * sstep(10, 16, t);
  // streetlights
  spotA.intensity = 180 * sstep(3, 6, t);
  spotB.intensity = 150 * sstep(10, 14, t);
  const flick = (Math.sin(t * 37.0) > -0.2 ? 1 : 0.25); // faulty lamp over rivals
  spotC.intensity = (60 * sstep(24, 27, t) + 140 * sstep(27, 30, t)) * (t < 32 ? flick : 1);
  // rim on the gang
  rim.intensity = 120 * sstep(5, 9, t);
  rim.color.copy(tmpC.copy(new THREE.Color(0x6fa8ff)).lerp(RED, sstep(32, 40, t)));
  // red push during confrontation
  redWash.intensity = 60 * sstep(32, 38, t);
  // sign flicker (subtle)
  signs[1].visible = Math.sin(t * 23.0) > -0.85;
  // haze
  dust.material.opacity = 0.45 * sstep(2, 8, t) + 0.25 * sstep(32, 38, t);
  const pa = dustGeo.attributes.position.array;
  for (let i = 0; i < DUST_N; i++) {
    pa[i * 3 + 1] += 0.0011;
    pa[i * 3] += Math.sin(t * 0.4 + i) * 0.0007;
    if (pa[i * 3 + 1] > 4.2) pa[i * 3 + 1] = 0;
  }
  dustGeo.attributes.position.needsUpdate = true;
}

// ================= DETERMINISTIC RENDER =================
rim.target.position.set(0, 1.2, 2);

window.__renderAt = function (t) {
  director.poseAt(t);
  const s = shot(t);
  camera.position.copy(s.pos);
  camera.lookAt(s.look);
  lights(t);
  // Fresh bone matrices before render: the shadow pass runs inside
  // renderer.render and would otherwise use stale matrices (defect 3 fix).
  scene.traverse((o) => { if (o.isSkinnedMesh) o.skeleton.update(); });
  renderer.render(scene, camera);
  return true;
};

// ============ AUTOMATED DEFECT GATES (AGENTS.md verification law) ============
// Computed from the actual animation data — not eyeballs. Run across the whole
// timeline via tools/promo-video/gates-check.js (dense sampling, fails loudly).
function trackVel(c, t) {
  const tr = c.rootTrack;
  const at = (tt) => {
    if (!tr || !tr.length) return c.basePos.clone();
    if (tt <= tr[0].t) return new THREE.Vector3(...tr[0].pos);
    for (let i = 0; i < tr.length - 1; i++) {
      const a = tr[i], b = tr[i + 1];
      if (tt >= a.t && tt <= b.t) {
        const f = (tt - a.t) / Math.max(1e-6, b.t - a.t);
        return new THREE.Vector3(
          a.pos[0] + (b.pos[0] - a.pos[0]) * f,
          a.pos[1] + (b.pos[1] - a.pos[1]) * f,
          a.pos[2] + (b.pos[2] - a.pos[2]) * f);
      }
    }
    return new THREE.Vector3(...tr[tr.length - 1].pos);
  };
  return at(t + 0.15).sub(at(t - 0.15)).divideScalar(0.3);
}

window.__gates = function (t) {
  director.poseAt(t);
  const out = {};
  const up = new THREE.Vector3();
  const hipW = new THREE.Vector3(), chestW = new THREE.Vector3();
  for (const c of cast) {
    const vis = !c.visible || (t >= c.visible[0] && t <= c.visible[1]);
    if (!vis) { out[c.name] = { visible: false }; continue; }
    const vel = trackVel(c, t);
    // Skip the crab check when the body isn't upright (suplex/inverted/falling):
    // facing is undefined when the torso isn't vertical.
    let upright = true;
    const hips = c.bones['Hips'], chest = c.bones['Spine2'] || c.bones['Spine'];
    if (hips && chest) {
      hips.getWorldPosition(hipW); chest.getWorldPosition(chestW);
      up.copy(chestW).sub(hipW);
      const ul = up.length();
      if (ul > 1e-4) { up.divideScalar(ul); upright = up.y > 0.5; }
    }
    // Skip when vertical staging dominates (lifts, slams) — not locomotion.
    const vy = Math.abs(vel.y);
    const vh = Math.hypot(vel.x, vel.z);
    const ang = (upright && vy < vh) ? c.staging.facingVsVelocityDeg(vel) : null;
    out[c.name] = {
      visible: true,
      minFootY: +c.staging.minFootY(c.bones).toFixed(3),
      facingVsVelocityDeg: ang === null ? null : +ang.toFixed(1),
      speed: +vh.toFixed(2),
      upright,
    };
  }
  return out;
};

window.__ready = true;
window.__dur = DUR;
</script>
