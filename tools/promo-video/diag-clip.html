<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>walk-test — universal orientation proof</title>
<style>html,body{margin:0;background:#0a0a0c;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { loadMotionBanks, bakeClipRole } from './faction-motion.js';
import { CharacterStaging } from './staging.js';
import { repairSkinWeights, cleanStrayWeights, autoSkinByDistance, NEEDS_RESKIN } from './reskin.js';

// C4D wrestling rigs -> canonical (Mixamo-style) bone names, so the mocap
// bake path stays family-agnostic.
const C4D_TO_CANON = {
  'J_Hips': 'Hips', 'J_Spine1': 'Spine', 'J_Spine2': 'Spine1',
  'J_Chest': 'Spine2', 'J_Neck': 'Neck', 'J_Head': 'Head',
  'J_Clavicle_L': 'LeftShoulder', 'J_Clavicle_R': 'RightShoulder',
  'J_Shoulder_L': 'LeftArm', 'J_Shoulder_R': 'RightArm',
  'J_Elbow_L': 'LeftForeArm', 'J_Elbow_R': 'RightForeArm',
  'J_Wrist_L': 'LeftHand', 'J_Wrist_R': 'RightHand',
  'J_Leg_L': 'LeftUpLeg', 'J_Leg_R': 'RightUpLeg',
  'J_Knee_L': 'LeftLeg', 'J_Knee_R': 'RightLeg',
  'J_Foot_L': 'LeftFoot', 'J_Foot_R': 'RightFoot',
  'J_Toe_L': 'LeftToeBase', 'J_Toe_R': 'RightToeBase',
};
const canonName = (raw) => raw.replace(/^mixamorig:?/, '');

const params = new URLSearchParams(location.search);
const MODEL = params.get('model') || 'ONYX_street.glb';
const DIR = params.get('dir') || 'toward'; // toward | across
const DUR = 7;
const CLIP = params.get('clip') || 'walk';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0c);
scene.fog = new THREE.Fog(0x0a0a0c, 18, 40);

const camera = new THREE.PerspectiveCamera(42, 960 / 540, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(960, 540);
renderer.shadowMap.enabled = params.get('noshadow') !== '1';
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xbfd0e0, 0x1a1c22, 0.85));
const key = new THREE.DirectionalLight(0xfff2e0, 2.0);
key.position.set(4, 7, 3);
key.castShadow = params.get('noshadow') !== '1';
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -8; key.shadow.camera.right = 8;
key.shadow.camera.top = 8; key.shadow.camera.bottom = -8;
scene.add(key);
const rim = new THREE.DirectionalLight(0x88aaff, 0.7);
rim.position.set(-5, 3, -4);
scene.add(rim);

// Ground: dark asphalt-ish + grid so foot slide/contact reads clearly.
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: 0x2a2c30, roughness: 0.95, metalness: 0.0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(40, 40, 0x3a3f4a, 0x23262c);
grid.position.y = 0.005;
scene.add(grid);

// Travel-direction arrow on the ground (self-documenting proof frames).
function travelArrow(from, to) {
  // thin chevrons offset to the side of the path (never block the character)
  const g = new THREE.Group();
  const dir = to.clone().sub(from); dir.y = 0;
  const len = dir.length(); dir.normalize();
  const side = new THREE.Vector3(-dir.z, 0, dir.x); // perpendicular
  const mat = new THREE.MeshBasicMaterial({ color: 0x33ff77, side: THREE.DoubleSide });
  for (let i = 1; i <= 5; i++) {
    const c = from.clone().lerp(to, i / 6).addScaledVector(side, 1.3);
    c.y = 0.03;
    const chev = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.42, 4), mat);
    chev.position.copy(c);
    // cone tip (+Y) -> travel dir, lying flat on the ground
    chev.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    g.add(chev);
  }
  return g;
}

const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
const gltf = await loader.loadAsync('/models/' + MODEL);
const root = gltf.scene;
scene.add(root);
// Optional weight repair (?fix=1): same repair the faction cinematic applies.
if (params.get('fix') === '1') {
  root.traverse((o) => { if (o.isSkinnedMesh) repairSkinWeights(o, 12); });
  console.log('[diag-clip] repairSkinWeights applied (12 passes)');
}
if (params.get('clean') === '1') {
  root.updateWorldMatrix(true, true);
  root.traverse((o) => { if (o.isSkinnedMesh) console.log('[diag-clip] cleanStrayWeights:', JSON.stringify(cleanStrayWeights(o))); });
}
if (params.get('autoskin') === '1') {
  root.updateWorldMatrix(true, true);
  root.traverse((o) => { if (o.isSkinnedMesh) console.log('[diag-clip] autoSkinByDistance:', JSON.stringify(autoSkinByDistance(o))); });
}

// Normalize rogue scales to ~1.85m BEFORE staging (C4D wrestling rips are
// giants; the engine does this via per-character scale metadata).
{
  const bb = new THREE.Box3().setFromObject(root);
  const h = bb.max.y - bb.min.y;
  if (h > 0.01) {
    const s = 1.85 / h;
    if (Math.abs(s - 1) > 0.03) {
      root.scale.setScalar(s);
      console.log('[walk-test] normalized height', h.toFixed(2), '-> 1.85m (scale', s.toFixed(3) + ')');
    }
  }
}

// Family-agnostic rest/bone maps (canonical keys).
const bones = {}, rest = {};
root.traverse((o) => {
  if (!o.isBone) return;
  const c = C4D_TO_CANON[o.name] || canonName(o.name);
  bones[c] = o;
  rest[c] = o.quaternion.clone();
});

// Shared staging: ground alignment + auto-detected facing. THE fix under test.
const staging = new CharacterStaging(root);
staging.centerXZ().syncY();

const WALK_FROM = DIR === 'across' ? new THREE.Vector3(-5, 0, 0) : new THREE.Vector3(0, 0, 6);
const WALK_TO = DIR === 'across' ? new THREE.Vector3(5, 0, 0) : new THREE.Vector3(0, 0, 0.5);
const travelDir = WALK_TO.clone().sub(WALK_FROM).setY(0).normalize();
staging.face(travelDir);
scene.add(travelArrow(WALK_FROM, WALK_TO));

root.traverse((o) => { if (o.isMesh) { o.castShadow = params.get('nocast') !== '1'; o.receiveShadow = false; } });
if (params.get('skeleton') === '1') {
  root.traverse((o) => {
    if (o.isSkinnedMesh) {
      const helper = new THREE.SkeletonHelper(o);
      helper.material.linewidth = 2;
      scene.add(helper);
    }
    if (o.isMesh) o.material = new THREE.MeshBasicMaterial({ wireframe: true, transparent: true, opacity: 0.25 });
  });
}

if (DIR === 'across') {
  camera.position.set(0, 1.6, 8.5);
  camera.lookAt(0, 1.15, 0);
} else {
  camera.position.set(0, 1.5, -2.6);
  camera.lookAt(0, 1.15, 3);
}

// Real mocap walk (CMU), looped; root motion from the staging track.
const banks = await loadMotionBanks();
const baked = bakeClipRole(banks.cmu[CLIP] || banks.bank[CLIP], 'atk', rest);
const ONLYBONE = params.get('onlybone') || null;
const NOCLIP = params.get('noclip') === '1';
const NOROOT = params.get('noroot') === '1';
function poseAt(t) {
  if (NOCLIP) {
    if (!NOROOT) {
      const k = Math.min(1, Math.max(0, t / DUR));
      const p = WALK_FROM.clone().lerp(WALK_TO, k);
      staging.place(p.x, 0, p.z);
    }
    return;
  }
  const tt = ((t % baked.dur) + baked.dur) % baked.dur;
  const times = baked.times;
  let i = 0;
  while (i < times.length - 2 && times[i + 1] < tt) i++;
  const f = (tt - times[i]) / Math.max(1e-6, times[i + 1] - times[i]);
  for (const [bn, qs] of Object.entries(baked.bones)) {
    const bone = bones[bn];
    if (!bone) continue;
    if (ONLYBONE && bn !== ONLYBONE) continue;
    // baked quats already include the rest pose (rest * clipDelta)
    bone.quaternion.copy(qs[i]).slerp(qs[i + 1], Math.min(1, Math.max(0, f)));
  }
  if (!NOROOT) {
    const k = Math.min(1, Math.max(0, t / DUR));
    const p = WALK_FROM.clone().lerp(WALK_TO, k);
    staging.place(p.x, 0, p.z);
  }
}

window.__renderAt = function (t) {
  poseAt(t);
  if (params.get('hidemesh') === '1') {
    root.traverse((o) => { if (o.isSkinnedMesh) o.visible = false; });
  }
  root.traverse((o) => { if (o.isSkinnedMesh) o.skeleton.update(); });
  renderer.render(scene, camera);
  return true;
};
window.__vertDebug = function () {
  const out = {};
  root.traverse((o) => {
    if (!o.isSkinnedMesh) return;
    const sk = o.skeleton;
    out.boneInversesLen = sk.boneInverses.length;
    out.bonesLen = sk.bones.length;
    // check first inverse
    out.inv0 = sk.boneInverses[0] ? sk.boneInverses[0].elements.slice(0,4) : null;
    // bind pose check: at current pose, compute boneMatrix for Hips
    const hi = sk.bones.findIndex((b) => (C4D_TO_CANON[b.name] || canonName(b.name)) === 'Hips');
    sk.bones[hi].updateWorldMatrix(true, false);
    const m = new THREE.Matrix4().multiplyMatrices(sk.bones[hi].matrixWorld, sk.boneInverses[hi]);
    // determinant of rotation part (should be ~1 for rigid)
    const e = m.elements;
    const det = e[0]*(e[5]*e[10]-e[6]*e[9]) - e[4]*(e[1]*e[10]-e[2]*e[9]) + e[8]*(e[1]*e[6]-e[2]*e[5]);
    out.hipsBoneMatrixDet = +det.toFixed(4);
    out.hipsBoneMatrixTrans = [e[12], e[13], e[14]].map((x) => +x.toFixed(3));
  });
  return out;
};
window.__vertMotion = function () {
  // for each vert, distance between rest pose and current pose; report top movers' bones
  const out = [];
  root.traverse((o) => {
    if (!o.isSkinnedMesh) return;
    const g = o.geometry, pos = g.attributes.position;
    const n = pos.count;
    // capture current (posed) positions by rendering to a temp attribute? Instead use skeleton math:
    // posedPos = sum w * boneMatrix * restPos. Compute manually.
    const sk = o.skeleton;
    const bm = [];
    for (let b = 0; b < sk.bones.length; b++) {
      sk.bones[b].updateWorldMatrix(true, false);
      bm.push(new THREE.Matrix4().multiplyMatrices(sk.bones[b].matrixWorld, sk.boneInverses[b]));
    }
    const sj = g.attributes.skinIndex, sw = g.attributes.skinWeight;
    const v = new THREE.Vector3(), pv = new THREE.Vector3();
    const movers = [];
    for (let i = 0; i < n; i++) {
      v.fromBufferAttribute(pos, i);
      pv.set(0, 0, 0);
      const tmp = new THREE.Vector3();
      for (let k = 0; k < 4; k++) {
        const w = [sw.getX(i), sw.getY(i), sw.getZ(i), sw.getW(i)][k];
        if (w < 1e-6) continue;
        const b = [sj.getX(i), sj.getY(i), sj.getZ(i), sj.getW(i)][k];
        tmp.copy(v).applyMatrix4(bm[b]);
        pv.addScaledVector(tmp, w);
      }
      // compare in mesh-local space: transform pv back by mesh.matrixWorld inverse, compare to v
      const inv = new THREE.Matrix4().copy(o.matrixWorld).invert();
      const pl = pv.clone().applyMatrix4(inv);
      const d = pl.distanceTo(v);
      if (d > 0.3) {
        const bn = sk.bones[sj.getX(i)] ? sk.bones[sj.getX(i)].name.replace('mixamorig','') : '?';
        movers.push({ d: +d.toFixed(3), y: +v.y.toFixed(3), bone: bn, w: +sw.getX(i).toFixed(2) });
      }
    }
    movers.sort((a, b) => b.d - a.d);
    out.push({ mesh: o.name, bigMovers: movers.length, top: movers.slice(0, 12) });
  });
  return out;
};
window.__skelCheck = function () {
  const out = {};
  root.traverse((o) => {
    if (!o.isSkinnedMesh) return;
    const sk = o.skeleton;
    out.mesh = o.name;
    out.nBones = sk.bones.length;
    // are traversed bones the same objects as skeleton.bones?
    const travBones = [];
    root.traverse((x) => { if (x.isBone) travBones.push(x); });
    out.travCount = travBones.length;
    out.sameObjects = travBones.every((tb) => sk.bones.includes(tb));
    // Hips boneMatrix
    const hi = sk.bones.findIndex((b) => (C4D_TO_CANON[b.name] || canonName(b.name)) === 'Hips');
    out.hipsIndex = hi;
    if (hi >= 0) {
      sk.bones[hi].updateWorldMatrix(true, false);
      const m = new THREE.Matrix4().multiplyMatrices(sk.bones[hi].matrixWorld, sk.boneInverses[hi]);
      out.hipsBoneMatrix = m.elements.map((x) => +x.toFixed(4));
      out.hipsInverse = sk.boneInverses[hi].elements.map((x) => +x.toFixed(4));
    }
  });
  return out;
};
window.__boneWorld = function (wantName) {
  let found = null;
  root.traverse((o) => {
    if (o.isBone && (C4D_TO_CANON[o.name] || canonName(o.name)) === wantName) found = o;
  });
  if (!found) return null;
  root.updateWorldMatrix(true, true);
  const p = new THREE.Vector3(), q = new THREE.Quaternion();
  found.getWorldPosition(p); found.getWorldQuaternion(q);
  return { pos: p.toArray().map((x) => +x.toFixed(4)),
           quat: [q.x, q.y, q.z, q.w].map((x) => +x.toFixed(4)) };
};
window.__forwardInfo = function () {
  return { method: staging.forwardMethod, forward: staging.modelForward.toArray().map((v) => +v.toFixed(3)) };
};
window.__ready = true;
</script>
</body>
</html>
