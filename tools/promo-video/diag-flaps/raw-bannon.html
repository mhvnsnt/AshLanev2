<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#1a1a1a}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(640,640);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);
const camera = new THREE.PerspectiveCamera(40,1,0.1,100);
camera.position.set(2.2,1.6,3.4); camera.lookAt(0,1.0,0);
scene.add(new THREE.AmbientLight(0xffffff,0.9));
const key=new THREE.DirectionalLight(0xffffff,1.6); key.position.set(3,5,4); scene.add(key);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0x333333}));
ground.rotation.x=-Math.PI/2; scene.add(ground);
// RAW — no reskin.js, no weight surgery, file as-shipped
const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
const gltf = await loader.loadAsync('/model.glb');
const root=gltf.scene; scene.add(root);
const bbox=new THREE.Box3().setFromObject(root);
const c=bbox.getCenter(new THREE.Vector3());
root.position.x-=c.x; root.position.z-=c.z; root.position.y-=bbox.min.y;
renderer.render(scene,camera);
window.__done=true;
</script></body></html>
