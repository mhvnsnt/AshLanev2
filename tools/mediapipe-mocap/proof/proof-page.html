<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MediaPipe Mocap Proof</title>
<style>
  html,body{margin:0;padding:0;background:#14141c;overflow:hidden}
  #c{width:960px;height:960px;display:block}
  #label{position:fixed;top:12px;left:16px;color:#fff;font:14px monospace;
    background:rgba(0,0,0,.55);padding:6px 10px;border-radius:6px}
</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="label">loading…</div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import {
  modelRestLandmarks, punchFromRest,
  MocapRecorder, mapRigBones, captureRigState, applyMocapToRig,
} from "./mediapipe-mocap.js";

const label = document.getElementById("label");
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(960, 960);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14141c);
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 50);
camera.position.set(0, 1.35, 3.4);
camera.lookAt(0, 1.0, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x334, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(2.5, 4, 3);
scene.add(key);
const rim = new THREE.DirectionalLight(0x88aaff, 1.2);
rim.position.set(-3, 2, -2.5);
scene.add(rim);
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(3, 48),
  new THREE.MeshStandardMaterial({ color: 0x1e1e2a, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const MODEL_URL = new URLSearchParams(location.search).get("model") || "/models/CAIN_ELIAS_gear.glb";
const loader = new GLTFLoader();
let rig, clip;

try {
  const gltf = await loader.loadAsync(MODEL_URL);
  const root = gltf.scene;
  const bbox = new THREE.Box3().setFromObject(root);
  const h = bbox.max.y - bbox.min.y;
  root.scale.setScalar(1.8 / h);
  const bbox2 = new THREE.Box3().setFromObject(root);
  root.position.y -= bbox2.min.y;
  scene.add(root);
  root.updateMatrixWorld(true);

  const boneMap = mapRigBones(root);
  rig = captureRigState(root, boneMap);
  // Rest landmarks synthesized FROM THE MODEL's own rest pose,
  // then a punch is generated on top. Full landmark->rig pipeline.
  const restLm = modelRestLandmarks(rig);
  const rec = new MocapRecorder(30);
  for (const f of punchFromRest(restLm, 30, 2)) rec.push(f);
  clip = rec.toClip("punch");
  label.textContent = `model ok · bones: ${boneMap.size}/20 · clip: ${clip.frames.length} frames`;
  window.__clipJson = JSON.stringify(clip);
} catch (e) {
  label.textContent = "LOAD ERROR: " + e.message;
  throw e;
}

window.__setTime = (t) => {
  const dirs = MocapRecorder.sample(clip, t);
  applyMocapToRig(dirs, rig);
  renderer.render(scene, camera);
  label.textContent = `t=${t.toFixed(2)}s · punch from MediaPipe landmarks`;
};
window.__ready = true;
window.__setTime(0);
</script>
</body>
</html>
