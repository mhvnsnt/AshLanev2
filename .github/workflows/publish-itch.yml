name: Publish to itch.io

# Pushes the web build to itch.io via butler (MIT, https://github.com/itchio/butler).
# Trigger: push a version tag (v1.2.3).
#
# One-time owner setup (itch.io):
#   1. Create the game at https://itch.io/game/new — Kind: HTML
#   2. API key: https://itch.io/user/settings/api-keys → repo secret BUTLER_API_KEY
#   3. Repo variables: ITCH_USER (your itch username), ITCH_GAME (game slug)
#   4. First push creates the html5 channel; then on the game's Edit page set
#      "This file will be played in the browser" for the html5 build.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit || echo "typecheck warnings"

      - run: PAGES_BUILD=1 npm run build
        env:
          PAGES_BUILD: "1"

      - uses: actions/upload-artifact@v4
        with:
          name: itch-deploy
          path: ./.output/public

  publish-itch:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: itch-deploy
          path: ./dist

      - name: Setup butler
        uses: remarkablegames/setup-butler@v2

      - name: Push html5 build
        run: |
          butler push ./dist ${{ vars.ITCH_USER }}/${{ vars.ITCH_GAME }}:html5 \
            --userversion "${GITHUB_REF_NAME#v}"
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
